spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:laundry_management;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common

app:
  security:
    jwt:
      secret: test-only-jwt-secret-with-at-least-thirty-two-bytes
      expiration: PT1H
